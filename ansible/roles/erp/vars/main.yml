security:
  oauth2:
    resourceserver:
      jwt:
        jwk_set_uri: http://localhost:8180/auth/realms/ERP/protocol/openid-connect/certs

datasource:
  jdbc:
    url: jdbc:sqlserver://localhost:1433;database=erp_db;encrypt=false;trustServerCertificate=false;
    driver: com.microsoft.sqlserver.jdbc.SQLServerDriver

  credentials:
    username: erp_db_user
    password: secretL0calPassword

flyway:
  locations:
    - database/mssql/migration
    - database/mssql/importMigration

redis:
  cache:
    key_prefix: "erp:"

  credentials:
    username: erpapp
    password: StrongAppPassword

sso:
  client_id: erp

cors:
  allowed_origins:
    - http://localhost:4200

logging:
  level:
    root: INFO

nagerdate:
  client_id: erp
  authorization_grant_type: password
  provider: nagerdate
  token_uri: http://localhost:8180/auth/realms/ERP/protocol/openid-connect/token

  api:
    url: https://date.nager.at

  credentials:
    username: erp_adm
    password: secret

auth:
  jwt:
    secret: $pbkdf2-sha256$600000$B5EBKwEMsD4COjNisHzEkw==$A1KWRjk6D34I5xp/YdH0Ops0+x0zSVCSoFFbh/K16XI=
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  session:
    ttl-minutes: 60
    # false so works over plain http://localhost. Set true once this runs behind HTTPS --
    # browsers (and curl's cookie jar) silently drop "Secure" cookies sent over plain http.
    cookie-secure: false
