spring:
  application:
    name: erp-customer-manager
  jpa:
    properties:
      hibernate:
        show_sql: false
        generate_statistics: true
  datasource:
    driver-class-name: org.h2.Driver
    password:
    username: sa
    url: jdbc:h2:mem:test;MODE=MSSQLServer;INIT=CREATE DOMAIN IF NOT EXISTS datetimeoffset AS TIMESTAMP WITH TIME ZONE;NON_KEYWORDS=VALUE
  flyway:
    enabled: true
    locations: database/mssql/migration,database/mssql/importMigration,database/mssql/testData
  sql:
    init:
      platform: org.hibernate.dialect.SQLServerDialect
  security:
    oauth2:
      client:
        provider:
          core_calculation:
            token-uri: http://localhost:8082/token

cors:
  allowed-origins: http://localhost:4200,http://example.com

sso:
  client-id: erp

coca-offer-management:
  name: coca-offer-management
  url: http://localhost:8082/

cdms-engine-types:
  name: cdms-api
  url: http://localhost:8082/

feign:
  client:
    coca:
      client-id: core_calculation
      username: admin
      password: admin
    cdms:
      client-id: cdms
      username: admin
      password: admin
