name: "CI Build for Develop Branch"

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ "develop", "master", "main" ]

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: BE Quality
        run: mvn clean install -P coverage

      - name: Upload SBOM
          uses: actions/upload-artifact@v4
          with:
            name: resource-planning-sbom
            path: target/resource-planning-sbom.json
            if-no-files-found: error
