name: "CI Build for Develop Branch"

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ "develop", "master", "main" ]

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: BE Quality
        run: mvn clean install -P coverage

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: resource-planning-sbom
          path: target/resource-planning-sbom.json
          if-no-files-found: error

  reproducible-build:
    name: Reproducible Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set Maven wrapper executable
        run: chmod +x mvnw

      - name: Build artifact - first build
        run: mvn clean package -P coverage

      - name: Calculate first build hash
        run: |
          sha256sum target/*.jar > /tmp/hash-first.txt
          cat /tmp/hash-first.txt

      - name: Clean build output
        run: mvn clean

      - name: Build artifact - second build
        run: mvn package -P coverage

      - name: Calculate second build hash
        run: |
          sha256sum target/*.jar > /tmp/hash-second.txt
          cat /tmp/hash-second.txt

      - name: Compare artifact hashes
        run: |
          diff -u /tmp/hash-first.txt /tmp/hash-second.txt
