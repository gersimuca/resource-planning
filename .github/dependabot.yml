version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter"
        versions: ["2.x"]
    labels:
      - "chore"
      - "maven"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    labels:
      - "chore"
      - "github-actions"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    labels:
      - "chore"
      - "docker"
