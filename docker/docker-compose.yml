name: erp-app
services:
  init-db:
    profiles: ["init"]
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: erp-init-db
    volumes:
      - ./mssql/init-db.sql:/init-db.sql
    env_file:
      - mssql/sqlserver.env
    command: /bin/bash -c '/opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P $$MSSQL_SA_PASSWORD -i init-db.sql'
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    profiles: ["core"]
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    healthcheck:
      test: [ 'CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -U sa -P $$MSSQL_SA_PASSWORD -Q "select 1" -C' ]
      interval: 5s
      retries: 10
    container_name: erp-mssql
    env_file:
      - mssql/sqlserver.env
    ports:
      - "1433:1433"

  mongodb:
    profiles: ["core"]
    image: mongo:8.0
    container_name: erp-mongodb
    restart: unless-stopped
    env_file:
      - mongodb/mongodb.env
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  local-erp-sso:
    profiles: ["auth"]
    container_name: erp-sso
    image: quay.io/keycloak/keycloak:26.7.1
    volumes:
      - ./sso/import:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8180:8180"
    command: [ "start-dev", "--http-relative-path=/auth", "--import-realm", "--http-port=8180" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8180/auth/realms/master || exit 1" ]
      interval: 10s
      retries: 10
      timeout: 5s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.7.3
    container_name: erp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9090/-/ready || exit 1" ]
      interval: 10s
      retries: 10
      timeout: 5s

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.3.0
    container_name: erp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000 || exit 1" ]
      interval: 10s
      retries: 10
      timeout: 5s

  sonarqube:
    profiles: ["dev"]
    image: sonarqube:lts
    container_name: erp-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    healthcheck:
      test: ["CMD", "curl -f http://localhost:9000/api/system/health || exit 1"]
      interval: 10s
      retries: 5
      timeout: 5s


  elasticsearch:
    profiles: ["logging"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: erp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep '\"status\":\"green\"' || exit 1"]
      interval: 10s
      retries: 10
      timeout: 5s

  logstash:
    profiles: ["logging"]
    image: docker.elastic.co/logstash/logstash:9.2.1
    container_name: erp-logstash
    ports:
      - "15000:15000"
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 15000 || exit 1" ]
      interval: 10s
      retries: 10
      timeout: 5s

  kibana:
    profiles: ["logging"]
    image: docker.elastic.co/kibana/kibana:9.2.1
    container_name: erp-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1" ]
      interval: 10s
      retries: 10
      timeout: 5s

  zookeeper:
    profiles: ["messaging"]
    container_name: erp-zookeeper
    image: confluentinc/cp-zookeeper:7.6.6
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/zookeeper_jaas.conf"
    volumes:
      - ./zookeeper/zookeeper_jaas.conf:/etc/kafka/zookeeper_jaas.conf
    ports:
      - 2181:2181
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok || exit 1" ]
      interval: 10s
      retries: 10
      timeout: 5s

  kafka:
    profiles: ["messaging"]
    container_name: erp-kafka
    image: confluentinc/cp-kafka:7.9.9
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./kafka/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      retries: 10
      timeout: 5s

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: erp-otel-collector
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      - prometheus
      - elasticsearch
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:4318/metrics" ]
      interval: 10s
      retries: 10
      timeout: 5s

  redis:
    profiles: ["core"]
    image: redis:7-alpine
    container_name: erp-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "StrongRedisPassword123", "ping"]
      interval: 10s
      retries: 10
